# FILE: docker-compose.yaml - For Production Deployment

services:
  gesturevision-prod:
    image: ${PROD_IMAGE_NAME?Variable PROD_IMAGE_NAME is not set}
    build:
      context: .
      target: production
      labels:
        - "project=gesturevision"
      args:
        # Build-time args for Vite using values from .env.prod
        - VITE_PROD_WHEP_BASE_URL=${APP_EXTERNAL_URL:-}
        - VITE_PROD_HA_DEFAULT_URL=${VITE_PROD_HA_DEFAULT_URL:-}
        - TARGETARCH=amd64
    container_name: gesturevision
    
    # Optional labels for deployment
    # labels:
    #   - "project=gesturevision"

    # -------------------------------------------------------------------------
    # NETWORK MODE CONFIGURATION:
    # -------------------------------------------------------------------------
    # Option A (DEFAULT): Host Network Mode.
    # Exposes web UI, API, and MediaMTX streams directly on your host IP on their natural ports.
    # (Nginx Web UI on host port 80, MediaMTX API on 9997, WebRTC on 8888, ICE on 8189, etc.)
    # network_mode: "host"

    # Option B: Custom NPM Bridge Network (RECOMMENDED when using Nginx Proxy Manager).
    # This places GestureVision on the same network as your Nginx Proxy Manager,
    # allowing NPM to resolve 'gesturevision' and route to 80, 9001, and 8888 with ZERO host port clashes.
    # To use Option B instead of Option A:
    # 1. Comment out 'network_mode: "host"' above.
    # 2. Uncomment 'networks' block below.
    # 3. If you need direct external streaming access, uncomment 'ports' block too.
    #
    ports:
      - "${MTX_ICE_UDP_PORT:-8189}:${MTX_ICE_UDP_PORT:-8189}/udp" # WebRTC ICE UDP
      - "${MTX_RTSP_PORT:-8554}:${MTX_RTSP_PORT:-8554}"           # Optional: Direct RTSP port
    networks:
      app_network:
        ipv4_address: ${DOCKER_IPV4_ADDRESS:-192.168.20.100}

    volumes:
      - ./config/config.prod.json:/app/config.json:rw
      - ./extensions:/app/extensions:rw
      - ./logs:/app/logs:rw
    env_file:
      - ./config/.env.prod
    environment:
      # --- Core & Frontend Injection Settings ---
      - NODE_ENV=production
      - VITE_PROD_WHEP_BASE_URL=${APP_EXTERNAL_URL:-}
      - VITE_PROD_HA_DEFAULT_URL=${VITE_PROD_HA_DEFAULT_URL:-}
      - BACKEND_API_PORT_INTERNAL=${BACKEND_API_PORT_INTERNAL:-9001}

      # --- MediaMTX Runtime Settings ---
      - MTX_LOGLEVEL=info
      - MTX_API=yes
      - MTX_WEBRTC_ALLOW_ORIGIN=${APP_EXTERNAL_URL}
      - MTX_WEBRTC_ADDITIONAL_HOSTS=${MTX_ICE_HOST}

      # Listeners inside the container (use the simplified port variables)
      - MTX_APIADDRESS=:${MTX_API_PORT:-9997}
      - MTX_WEBRTCADDRESS=:${MTX_WEBRTC_PORT:-8888}
      - MTX_WEBRTCUDPMUXADDRESS=:${MTX_ICE_UDP_PORT:-8189}
      - MTX_RTSPADDRESS=:${MTX_RTSP_PORT:-8554}
      - MTX_RTMPADDRESS=:${MTX_RTMP_PORT:-1935}
      - MTX_HLSADDRESS=${MTX_HLS_ADDRESS:-} # Disabled by default

    restart: unless-stopped

# -----------------------------------------------------------------------------
# NETWORK DEFINITION (For Option B: Custom NPM or Macvlan Integration)
# -----------------------------------------------------------------------------
# Un-comment the section below if you are using Option B above.
# Define/reference your proxy/macvlan network here so Compose can bind the container.
#
networks:
  jw_admin:
    name: ${NPM_NETWORK_NAME:-docker_network}
    external: true






