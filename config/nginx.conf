# nginx.conf - Config for Nginx inside Production Container

# HA Add-ons run as root by default. Explicitly stating this prevents startup warnings.
user root;
worker_processes auto;
pid /var/run/nginx.pid;

env VITE_PROD_WHEP_BASE_URL;
env VITE_PROD_HA_DEFAULT_URL;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic logging - Redirect to stdout/stderr for Docker/HA logging visibility
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # Perl variables for runtime injection
    perl_set $vite_prod_whep_base_url 'sub { return $ENV{"VITE_PROD_WHEP_BASE_URL"} || ""; }';
    perl_set $vite_prod_ha_url 'sub { return $ENV{"VITE_PROD_HA_DEFAULT_URL"} || ""; }';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_service {
        server 127.0.0.1:9001;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Disable absolute redirects to ensure Ingress relative paths work
        absolute_redirect off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;

        # Main App Route
        location = /index.html {
            sub_filter_once on;
            sub_filter '<script id="app-config"></script>'
                       '<script>window.runtimeConfig = { WHEP_BASE_URL: "$vite_prod_whep_base_url", HA_URL: "$vite_prod_ha_url" };</script>';
            try_files $uri =404;
        }

        # WebSocket Proxy
        location /ws/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CRITICAL for HA Ingress: Disable buffering to prevent connection reset errors
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Plugin Assets - GENERIC SUPPORT
        location /plugins/ {
            # CRITICAL FIX: Allow Nginx to serve files through symbolic links.
            # This is required because runtime plugins live in /data/plugins (persistent),
            # which is symlinked to /usr/share/nginx/html/plugins.
            disable_symlinks off;
            
            alias /usr/share/nginx/html/plugins/;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Backend API Proxy
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Disable buffering for API to ensure immediate responses
            proxy_buffering off;
            proxy_cache off;
        }
        
        # Fallback for Ingress (SPA Routing)
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}