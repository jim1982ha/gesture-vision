name: "GestureVision"
version: "4.2.16"
slug: "ha-addon"
description: "AI-Powered Gesture Control using Webcams or RTSP cameras."
url: "https://github.com/jim1982ha/gesture-vision"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - "config:rw"
devices:
  - /dev/video0
  - /dev/video1
  - /dev/video2
ingress: true
ingress_port: 80
panel_icon: mdi:hand-wave
# HA Permissions Best Practices
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8888/tcp: 8888
  8189/udp: 8189
  1935/tcp: 1935
  8554/tcp: 8554
options:
  mtx_ice_host: ""
  log_level: "info"
schema:
  mtx_ice_host: str?
  log_level: list(debug|info|warn|error)
# Add descriptions for options
descriptions:
  mtx_ice_host: "REQUIRED: The LAN IP address of your Home Assistant server (e.g., 192.168.1.100). Needed for RTSP/WebRTC video streaming."
  log_level: "Controls the verbosity of the logs (debug, info, warn, error)."