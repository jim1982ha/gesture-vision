name: "GestureVision"
version: "4.2.41"
slug: "gesturevision_ai"
description: "AI-Powered Gesture Control using Webcams or RTSP cameras."
url: "https://github.com/jim1982ha/gesture-vision"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - "config:rw"
devices:
  - /dev/video0
  - /dev/video1
  - /dev/video2
ingress: true
ingress_port: 80
panel_icon: mdi:hand-wave

# Security & Permissions
# apparmor: true enforces AppArmor profile (Security Rating +1)
apparmor: true
homeassistant_api: true
hassio_api: true
auth_api: true

ports:
  8888/tcp: 8888
  8189/udp: 8189
  1935/tcp: 1935
  8554/tcp: 8554
options:
  mtx_ice_host: ""
  log_level: "info"
schema:
  mtx_ice_host: str?
  log_level: list(debug|info|warn|error)