<!-- FILE: packages/frontend/src/partials/_modal_settings_tab_rtsp.html -->
<div class="settings-tab-content" data-tab-content="rtsp">
  <div id="rtspSourceListContainer" class="mb-4 grid grid-cols-1 gap-3">
    <p id="rtspListPlaceholder" class="list-placeholder"></p>
  </div>
  <div id="rtspListActionsContainer" class="flex justify-end mb-4">
    <button id="rtspAddNewButton" class="btn btn-primary">
      <span class="material-icons"></span>
      <span id="rtspAddNewButtonLabel">Add New Source</span>
    </button>
  </div>
  <div
    id="rtspAddEditFormContainer"
    class="hidden mt-4 border border-dashed border-border p-4 rounded-lg bg-background"
  >
    <h5 id="rtspFormTitle" class="text-base font-semibold mb-4">
      Add New RTSP Source
    </h5>
    <input type="hidden" id="rtspEditIndex" value="-1" />
    <div class="form-group">
      <label for="rtspSourceName" id="rtspNameLabel" class="form-label"
        >Name</label
      >
      <input type="text" id="rtspSourceName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="rtspSourceUrl" id="rtspUrlLabel" class="form-label"
        >URL</label
      >
      <input type="text" id="rtspSourceUrl" class="form-control" required />
      <small id="rtspUrlHelp" class="form-help-text"></small>
    </div>
    <!-- FIX: Use a flex container for the checkbox and label -->
    <div class="form-group form-group-checkbox-inline">
      <input type="checkbox" id="rtspSourceOnDemand" class="form-checkbox" />
      <label
        for="rtspSourceOnDemand"
        id="rtspSourceOnDemandLabel"
        class="form-label"
        >Connect On Demand</label
      >
    </div>
    <fieldset class="form-group">
      <legend id="rtspRoiSettingsLabel" class="form-label">
        Region of Interest (ROI) Crop (Optional)
      </legend>
      <div class="form-row">
        <div class="form-group">
          <label for="rtspRoiX" id="rtspRoiXLabel" class="form-label"></label
          ><input
            type="number"
            id="rtspRoiX"
            class="form-control"
            min="0"
            max="100"
            step="1"
          />
        </div>
        <div class="form-group">
          <label for="rtspRoiY" id="rtspRoiYLabel" class="form-label"></label
          ><input
            type="number"
            id="rtspRoiY"
            class="form-control"
            min="0"
            max="100"
            step="1"
          />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label
            for="rtspRoiWidth"
            id="rtspRoiWidthLabel"
            class="form-label"
          ></label
          ><input
            type="number"
            id="rtspRoiWidth"
            class="form-control"
            min="1"
            max="100"
            step="1"
          />
        </div>
        <div class="form-group">
          <label
            for="rtspRoiHeight"
            id="rtspRoiHeightLabel"
            class="form-label"
          ></label
          ><input
            type="number"
            id="rtspRoiHeight"
            class="form-control"
            min="1"
            max="100"
            step="1"
          />
        </div>
      </div>
      <small id="rtspRoiHelp" class="form-help-text"></small>
    </fieldset>
    <div class="mt-4 flex justify-end gap-2">
      <button id="rtspCancelEditButton" class="btn btn-secondary">
        <span class="material-icons"></span><span>Cancel</span>
      </button>
      <button id="rtspSaveSourceButton" class="btn btn-primary">
        <span class="material-icons"></span
        ><span id="rtspSaveButtonLabel">Add</span>
      </button>
    </div>
  </div>
</div>
