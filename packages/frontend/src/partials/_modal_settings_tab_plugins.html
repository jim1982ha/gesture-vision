<!-- FILE: packages/frontend/src/partials/_modal_settings_tab_plugins.html -->
<div class="settings-tab-content" data-tab-content="plugins">
  <div class="mb-6">
    <div class="form-group">
      <label
        for="pluginInstallUrl"
        id="pluginInstallUrlLabel"
        class="form-label"
        >Install New Plugin from URL</label
      >
      <div class="flex items-center gap-2">
        <input
          type="url"
          id="pluginInstallUrl"
          class="form-control"
          placeholder="https://github.com/user/gesturevision-plugin.git"
          autocomplete="off"
        />
        <button id="pluginInstallBtn" class="btn btn-primary flex-shrink-0">
          <span class="material-icons"></span>
          <span id="pluginInstallBtnText">Install</span>
        </button>
      </div>
    </div>
  </div>
  <div id="pluginsListContainer" class="grid grid-cols-1 gap-3">
    <p id="pluginsListPlaceholder" class="list-placeholder"></p>
  </div>
  <div
    class="flex items-center justify-center gap-2 text-sm text-text-secondary py-2 mt-6"
  >
    <span class="material-icons">code</span>
    <span id="pluginDevInfoText"></span>
    <button
      id="openPluginDevDocsBtn"
      class="underline hover:text-primary"
      type="button"
    ></button>
  </div>
</div>
