<!-- FILE: packages/frontend/src/partials/_modal_settings_tab_general.html -->
<div class="settings-tab-content active" data-tab-content="general">
  <div class="form-section">
    <label id="globalCooldownLabel" class="form-label"
      >Global Gesture Cooldown (s)</label
    >
    <div class="slider-group">
      <output
        for="globalCooldownSlider"
        id="globalCooldownValue"
        class="slider-output"
        >2.0s</output
      >
      <div class="slider-container">
        <input
          type="range"
          id="globalCooldownSlider"
          class="form-slider"
          min="0"
          max="10"
          step="0.5"
          value="2.0"
        />
      </div>
    </div>
  </div>

  <div class="form-section">
    <label id="resolutionPrefLabel" class="form-label"
      >Processing Resolution</label
    >
    <div
      id="resolutionSelectGroup"
      class="button-toggle-group w-full"
      role="radiogroup"
    ></div>
    <small id="resolutionHelp" class="form-help-text"></small>
  </div>

  <div class="form-section">
    <label id="targetFpsLabel" class="form-label">Target Processing FPS</label>
    <div
      id="targetFpsSelectGroup"
      class="button-toggle-group w-full desktop:w-auto btn-group-sm-text"
      role="radiogroup"
    ></div>
    <small id="targetFpsHelp" class="form-help-text"></small>
  </div>

  <div class="form-section">
    <label id="telemetryEnabledLabel" class="form-label"
      >Send Anonymous Usage Data</label
    >
    <div
      id="telemetryToggleGroup"
      class="button-toggle-group w-full"
      role="radiogroup"
    ></div>
    <small id="telemetryEnabledHelp" class="form-help-text"></small>
  </div>
</div>
