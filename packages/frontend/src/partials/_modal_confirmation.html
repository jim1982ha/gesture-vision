<!-- FILE: packages/frontend/src/partials/_modal_confirmation.html -->
<div
  id="confirmationModal"
  class="modal hidden"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="confirmationModalTitle"
  aria-describedby="confirmationModalMessage"
>
  <div class="modal-content">
    <h3
      id="confirmationModalTitle"
      class="modal-header justify-center text-lg font-semibold"
    ></h3>
    <div class="modal-scrollable-content text-center">
      <p id="confirmationModalMessage"></p>
    </div>
    <div class="modal-actions justify-end">
      <button id="confirmationModalCancelBtn" class="btn btn-secondary">
        <span class="material-icons"></span>
        <span id="confirmationModalCancelBtnText">Cancel</span>
      </button>
      <button id="confirmationModalConfirmBtn" class="btn btn-primary">
        <span class="material-icons"></span>
        <span id="confirmationModalConfirmBtnText">Confirm</span>
      </button>
    </div>
  </div>
</div>
