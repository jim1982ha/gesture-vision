<!-- FILE: packages/frontend/src/partials/_main_content.html -->
<main
  id="main-content"
  class="main-content group/main flex-1 flex flex-col p-4 relative desktop:overflow-y-auto"
>
  <h2
    id="liveFeedTitle"
    class="flex items-center gap-2 text-lg font-semibold text-text-primary mb-3"
  >
    <span class="config-title-icon material-icons text-primary"></span>
    <span data-translate-text>Live Feed</span>
    <button
      id="toggleVideoButton"
      class="btn btn-icon btn-icon-primary ml-auto"
      title="Hide Video"
      aria-label="Hide Video"
      aria-pressed="false"
    >
      <span class="material-icons"></span>
    </button>
  </h2>

  <div
    class="video-container group/video group-[.video-hidden]/main:max-h-0 group-[.video-hidden]/main:m-0 group-[.video-hidden]/main:overflow-hidden group-[.video-hidden]/main:invisible relative w-full aspect-video bg-black rounded-lg shadow-md overflow-hidden mb-4 flex-shrink-0"
  >
    <video
      id="webcam"
      class="absolute top-0 left-0 w-full h-full object-cover"
      autoplay
      playsinline
      muted
      crossorigin="anonymous"
    ></video>
    <canvas
      id="output_canvas"
      class="absolute top-0 left-0 w-full h-full"
    ></canvas>

    <!-- Toolbar is now a direct child of video-container for correct stacking context -->
    <div id="video-toolbar-container" class="absolute top-2 right-2 z-30 flex items-start gap-1 pointer-events-auto">
        <div class="flex flex-col items-end gap-2">
            <div class="flex items-center gap-1">
                <div id="stream-actions-group" class="overlay-surface flex items-center gap-1 rounded-full opacity-0 group-hover/video:opacity-100 transition-opacity">
                    <button id="videoMirrorBtn" class="btn btn-icon"><span class="material-icons"></span></button>
                    <button id="flipCameraBtn" class="btn btn-icon hidden"><span class="material-icons"></span></button>
                    <button id="displayAdjustmentsBtn" class="btn btn-icon"><span class="material-icons"></span></button>
                    <button id="aiTuningBtn" class="btn btn-icon"><span class="material-icons"></span></button>
                    <button id="videoStopBtn" class="btn btn-icon btn-icon-danger"><span class="material-icons"></span></button>
                </div>
                <button id="videoSizeToggleButton" class="btn btn-icon overlay-surface rounded-full">
                    <span class="material-icons"></span>
                </button>
            </div>
            <div id="display-adjustments-panel" class="video-overlay-panel hidden">
                <div class="tuning-sliders-container">
                    <div class="flex-1 flex flex-col gap-2">
                        <div class="slider-group"><label for="brightnessSlider" id="brightnessLabel"></label><input type="range" id="brightnessSlider" data-config-key="lowLightBrightness" min="0" max="200" /><output for="brightnessSlider" id="brightnessValue">100%</output></div>
                        <div class="slider-group"><label for="contrastSlider" id="contrastLabel"></label><input type="range" id="contrastSlider" data-config-key="lowLightContrast" min="0" max="200" /><output for="contrastSlider" id="contrastValue">100%</output></div>
                        <div class="flex justify-end">
                            <button id="resetDisplayAdjustmentsBtn" class="btn btn-icon" title="Reset Adjustments"><span class="material-icons">restart_alt</span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="ai-tuning-panel" class="video-overlay-panel hidden">
                <div class="tuning-sliders-container">
                    <div class="flex-1 flex flex-col gap-1">
                        <div id="handTuningSliders">
                            <div class="slider-group"><label for="handDetectionConfidenceSlider" id="handTuningDetectLabel"></label><input type="range" id="handDetectionConfidenceSlider" data-config-key="handDetectionConfidence" min="0.1" max="0.9" step="0.05" /><output id="handDetectionConfidenceOutput">50%</output></div>
                            <div class="slider-group"><label for="handPresenceConfidenceSlider" id="handTuningPresenceLabel"></label><input type="range" id="handPresenceConfidenceSlider" data-config-key="handPresenceConfidence" min="0.1" max="0.9" step="0.05" /><output id="handPresenceConfidenceOutput">50%</output></div>
                            <div class="slider-group"><label for="handTrackingConfidenceSlider" id="handTuningTrackLabel"></label><input type="range" id="handTrackingConfidenceSlider" data-config-key="handTrackingConfidence" min="0.1" max="0.9" step="0.05" /><output id="handTrackingConfidenceOutput">40%</output></div>
                        </div>
                        <div id="poseTuningSliders" class="hidden">
                            <div class="slider-group"><label for="poseDetectionConfidenceSlider" id="poseTuningDetectLabel"></label><input type="range" id="poseDetectionConfidenceSlider" data-config-key="poseDetectionConfidence" min="0.1" max="0.9" step="0.05" /><output id="poseDetectionConfidenceOutput">50%</output></div>
                            <div class="slider-group"><label for="posePresenceConfidenceSlider" id="poseTuningPresenceLabel"></label><input type="range" id="posePresenceConfidenceSlider" data-config-key="posePresenceConfidence" min="0.1" max="0.9" step="0.05" /><output id="posePresenceConfidenceOutput">50%</output></div>
                            <div class="slider-group"><label for="poseTrackingConfidenceSlider" id="poseTuningTrackLabel"></label><input type="range" id="poseTrackingConfidenceSlider" data-config-key="poseTrackingConfidence" min="0.1" max="0.9" step="0.05" /><output id="poseTrackingConfidenceOutput">35%</output></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Unified Overlay Container for non-interactive elements -->
    <div
      id="video-overlay-container"
      class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-2"
    >
        <div class="pointer-events-auto">
            <!-- This div is intentionally left empty to push the content below it to the bottom -->
        </div>
        <div id="gesture-feedback-container">
            <div id="gesture-feedback-overlay" class="hidden mx-auto w-fit">
                <span id="currentGestureSpan" class="truncate">-</span>
                <div class="confidence-bar-container">
                    <div id="confidenceBar" class="confidence-bar"></div>
                    <div id="confidenceThresholdMarker" class="confidence-threshold-marker"></div>
                </div>
                <div id="holdTimeMetric" class="timer-display hidden"><span class="material-icons"></span><span id="holdTimeDisplay">-</span></div>
            </div>
        </div>
    </div>

    <!-- Full-screen overlays that sit on top of everything else -->
    <div id="progress-rings-overlay" class="progress-rings w-20 h-20 z-20 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <defs></defs>
        <circle class="cooldown-progress" cx="40" cy="40" r="36.5" stroke-width="7"></circle>
        <circle class="gesture-progress" cx="40" cy="40" r="31.5" stroke-width="7"></circle>
      </svg>
    </div>
    <div id="connectingOverlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center rounded-inherit text-on-primary transition-opacity duration-200">
        <div class="overlay-text-container hidden flex-col items-center justify-center"><div class="h-8 w-8 animate-spin rounded-full border-4 border-solid border-white border-r-transparent"></div><div id="connectingText" class="connecting-text"></div></div>
        <div class="overlay-icon-container hidden h-16 w-16 cursor-pointer items-center justify-center rounded-full transition-all duration-200"><span class="material-icons text-4xl"></span></div>
    </div>
  </div>

  <div class="flex items-center justify-between gap-2 mb-3 flex-shrink-0">
    <h2
      id="desktopConfigListTitle"
      class="flex items-center gap-2 text-lg font-semibold text-text-primary"
    >
      <span class="config-title-icon material-icons text-primary"></span>
      <span data-translate-text>Configured Actions</span>
    </h2>
    <button id="addNewActionButton" class="btn btn-primary">
      <span class="material-icons"></span>
      <span id="addNewActionButtonLabel"></span>
    </button>
  </div>

  <div
    id="configListContainer"
    class="flex-1 overflow-y-auto desktop:overflow-y-visible"
  >
    <div
      id="configList"
      class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-3 content-start items-start"
    ></div>
  </div>
</main>
