<!-- FILE: packages/frontend/src/partials/_modal_settings_head.html -->
<div id="settingsModalTitle" class="modal-header">
  <span class="material-icons header-icon"></span>
  <span class="header-title">Configuration</span>
  <button
    id="mainSettingsCloseButton"
    class="btn btn-icon header-close-btn"
    aria-label="Close Settings"
  >
    <span class="mdi" aria-hidden="true"></span>
  </button>
</div>

<!-- Responsive Tab Navigation -->
<div class="flex-grow min-h-0 lg:flex">
  <!-- Mobile-only Select Dropdown -->
  <div class="lg:hidden p-4 border-b border-border">
    <select id="settingsTabsMobileSelect" class="form-control"></select>
  </div>

  <!-- Desktop Sidebar Navigation -->
  <nav
    id="settingsTabsDesktopNav"
    class="hidden lg:flex flex-col gap-1 w-52 p-4 border-r border-border bg-background"
  >
    <!-- Buttons will be dynamically inserted by JS -->
  </nav>

  <!-- Tab Content Area - This container is now the scrollable one -->
  <div id="settingsTabContentContainer" class="modal-scrollable-content flex-1 min-h-0 flex flex-col">
    <!-- The individual tab panes are now placed here directly -->
    <div class="settings-tab-content active" data-tab-content="general"></div>
    <div class="settings-tab-content" data-tab-content="customGestures"></div>
    <div class="settings-tab-content" data-tab-content="plugins"></div>
    <div class="settings-tab-content" data-tab-content="rtsp"></div>
    <div class="settings-tab-content" data-tab-content="appearance"></div>
  </div>
</div>
