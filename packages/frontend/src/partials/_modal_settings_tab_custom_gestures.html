<!-- FILE: packages/frontend/src/partials/_modal_settings_tab_custom_gestures.html -->
<div class="settings-tab-content" data-tab-content="customGestures">
  <div class="form-section">
    <h4 id="savedHandGesturesTitleElement" class="form-label">
      Saved Custom Hand Gestures
    </h4>
    <div
      id="customHandGestureListContainer"
      class="mt-2 grid grid-cols-1 gap-3"
    >
      <p id="customHandGestureListPlaceholder" class="list-placeholder"></p>
    </div>
  </div>
  <div class="form-section">
    <h4 id="savedPoseGesturesTitleElement" class="form-label">
      Saved Custom Pose Gestures
    </h4>
    <div
      id="customPoseGestureListContainer"
      class="mt-2 grid grid-cols-1 gap-3"
    >
      <p id="customPoseGestureListPlaceholder" class="list-placeholder"></p>
    </div>
  </div>
  <div class="form-section">
    <form
      id="custom-gestures-actions-form"
      onsubmit="return false;"
      class="mt-6 flex justify-end items-center gap-4"
    >
      <div id="custom-gestures-actions-slot" class="flex gap-2"></div>
      <input
        type="file"
        id="customGestureFile"
        class="visually-hidden"
        accept=".js"
      />
      <button
        id="upload-custom-gesture-file-btn"
        type="button"
        class="btn btn-secondary"
      >
        <span class="material-icons"></span>
        <span id="upload-custom-gesture-file-btn-text"></span>
      </button>
    </form>
    <div
      id="custom-gesture-import-preview"
      class="hidden mt-4 border border-dashed border-border p-4 rounded-lg bg-background"
    >
      <h4 id="importPreviewTitle" class="text-base font-semibold mb-4"></h4>
      <div class="form-group">
        <label id="importPreviewNameLabel" for="importPreviewNameInput"></label
        ><input type="text" id="importPreviewNameInput" class="form-control" />
      </div>
      <div class="form-group">
        <label
          id="importPreviewDescLabel"
          for="importPreviewDescTextarea"
        ></label
        ><textarea
          id="importPreviewDescTextarea"
          class="form-control"
          rows="2"
        ></textarea>
      </div>
      <div class="form-group">
        <label id="importPreviewTypeLabel" class="form-label"></label>
        <p id="importPreviewTypeValue" class="px-3 py-2"></p>
      </div>
    </div>
    <div
      id="custom-gesture-import-actions"
      class="hidden mt-2 flex justify-end gap-2"
    >
      <button
        id="cancelCustomGestureImportBtn"
        type="button"
        class="btn btn-secondary"
      >
        <span class="material-icons"></span><span></span>
      </button>
      <button id="uploadCustomGestureBtn" type="button" class="btn btn-primary">
        <span class="material-icons"></span
        ><span id="uploadCustomGestureBtnText"></span>
      </button>
    </div>
  </div>
</div>
